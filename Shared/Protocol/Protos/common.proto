syntax = "proto3";                              // 普通标量缺省为 0/空字符串，接收方仍需校验。

package norn.protocol;                           // Protobuf 逻辑命名空间，与磁盘路径无关。
option csharp_namespace = "Game.NetworkProtocol"; // 业务服与 Unity 共用的 C# namespace。

// 契约约定：已发布字段编号不可改作其他含义；删除时用 reserved 保留编号及旧名称。

////////////////////////////////////////////////////////////////
//  基础定义 / Basic Defines
////////////////////////////////////////////////////////////////

// 实时 Envelope 根据种类分发消息；Protobuf 自身不负责网络连接或分发。
enum RealtimeMessageKind
{
    REALTIME_MESSAGE_KIND_UNSPECIFIED  = 0; // 未指定，无效种类，避免缺省值误入处理器。
    REALTIME_MESSAGE_KIND_PING_REQUEST = 1; // 客户端 → 副本服，消息体为 ProtocolPingRequest。
    REALTIME_MESSAGE_KIND_PING_REPLY   = 2; // 副本服 → 客户端，消息体为 ProtocolPingReply。
}

// HTTP 入口的稳定错误分类；程序按错误码处理，不按诊断文本匹配。
enum ProtocolErrorCode
{
    PROTOCOL_ERROR_CODE_UNSPECIFIED              = 0; // 未指定，不表示成功。
    PROTOCOL_ERROR_CODE_VERSION_MISMATCH         = 1; // 应用协议版本不兼容，HTTP 409。
    PROTOCOL_ERROR_CODE_INVALID_PAYLOAD          = 2; // 空包、损坏消息或文本超预算，HTTP 400。
    PROTOCOL_ERROR_CODE_PAYLOAD_TOO_LARGE        = 3; // Ping 请求体超过 1024 字节，HTTP 413。
    PROTOCOL_ERROR_CODE_UNSUPPORTED_CONTENT_TYPE = 4; // Content-Type 不符合约定，HTTP 415。
}

////////////////////////////////////////////////////////////////
//  连通性探测 / Protocol Ping
////////////////////////////////////////////////////////////////

// 基础链路探测请求，不构成登录认证或线上资产授权。
message ProtocolPingRequest
{
    uint32 protocol_version = 1; // 应用协议版本，非 Protobuf 库版本；缺省 0 必须拒绝。
    uint64 sequence         = 2; // 请求关联序号，回复原样带回；非玩家 ID，不自动防重放。
    string message          = 3; // 探测文本，UTF-8 最多 256 字节，不是 256 个字符。
}

// 探测回复；与请求分别定义，便于独立扩展。
message ProtocolPingReply
{
    uint32 protocol_version = 1; // 服务端实际使用的应用协议版本，供客户端检查兼容性。
    uint64 sequence         = 2; // 原请求序号，用于匹配请求与回复。
    string message          = 3; // 原请求文本，只证明往返保真，不表示业务授权。
}

////////////////////////////////////////////////////////////////
//  错误响应 / Protocol Errors
////////////////////////////////////////////////////////////////

// HTTP 状态表达入口结果；此消息进一步说明原因与期望版本。
message ProtocolError
{
    ProtocolErrorCode code                      = 1; // 稳定错误分类，调用方据此处理。
    string            message                   = 2; // 诊断说明，不包含密码、Token 或内部堆栈。
    uint32            expected_protocol_version = 3; // 服务端期望版本，不表示可跳过校验强行重试。
}

////////////////////////////////////////////////////////////////
//  服务信息 / Service Info
////////////////////////////////////////////////////////////////

// 查询当前连接的业务进程身份；不证明数据库已就绪。
message ServiceInfoReply
{
    string service          = 1; // 服务逻辑名称，如 norn.business，不是网络地址。
    string version          = 2; // 业务程序集版本，如 0.1.0，非 SDK/Protobuf 版本。
    uint32 protocol_version = 3; // 服务端支持的应用协议版本，当前为 1。
}
