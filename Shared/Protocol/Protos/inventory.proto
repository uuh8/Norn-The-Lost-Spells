syntax = "proto3";
package norn.protocol;
option csharp_namespace = "Game.NetworkProtocol";

////////////////////////////////////////////////////////////////
// 完整库存只读快照：离散、Owner-only、可靠通道，不是每 Tick 消息
////////////////////////////////////////////////////////////////

// 网络层校验应用版本与 Wire 预算；认证身份及目录/父链语义由上层再次校验。
// WorldSceneKey 不通过网络发送，由 Client 当前世界提供，不能加载包中指定的 Scene。
message InventorySnapshotMessage
{
    uint32 protocol_version = 1;                    // 应用协议版本，默认0或旧版拒绝，不是Protobuf库版本。
    uint32 schema_version = 2;                      // 本完整快照合同版本，当前1；默认0不取得数据资格。
    uint32 connection_epoch = 3;                    // 当前认证连接代次，旧连接的迟到快照必须拒绝。
    fixed64 snapshot_sequence = 4;                  // 当前连接内非零单调快照序号，与战斗事实序号独立。
    uint32 resource_version = 5;                    // 同批资源读数版本，不在Client自行回蓝/推进CD。
    uint32 selection_version = 6;                   // 同批杖/工具选择版本；重放不是一次新的选择命令。
    uint32 spell_use_version = 7;                   // 同批法术资格版本，不能仅凭剩余次数猜本局资格。
    uint32 server_tick = 8;                         // 捕获时权威Tick；允许初始0，作为后续资源事实的基线。
    InventoryOwnedAssetMessage assets = 9;          // 当前真实装备/安装卡闭包，不是最初EntrySnapshot的旧余额。
    repeated InventoryWandPresentationMessage wands = 10; // 每根装备法杖的当前读数，完整提供，最多3根。
    repeated InventorySpellUsePresentationMessage spell_uses = 11; // 仅真实法术实例的资格，含包内/安装/专区，最多4096项。
    uint32 selected_tool_slot_plus_one = 12; // 0由SelectedWand推导选择，1..7指工具槽0..6；Run核验真实绑定容器，共用SelectionVersion。
    InventoryGroundSnapshotMessage ground = 13; // 当前Run共享地面容器完整视图；可缺省用于隔离测试，存在则Version非零并有界，不赋予拾取权限。
    bool research_open = 14; // 仅可信Home研究会话事实；关闭不含研究正文。
    uint32 research_session_version = 15; // 独立会话修订，Home初始关闭为1，普通副本为0，Home每份快照持续携当前值。
    bytes research_json = 16; // 仅开启时的Core研究子树canonical UTF8，最多24MiB，整Snapshot仍受32MiB预算约束。
}

// 共享地面状态与Owner携带状态分别编号；同一实例不能同时出现在本Owner和地面候选中。
message InventoryGroundSnapshotMessage
{
    uint32 version = 1; // 当前共享地面非零版本；完整校验/安装后才成为可读状态，不以收页当安装。
    repeated InventoryGroundItemMessage items = 2; // 最多4*4096=16384个真实容器，受整包32MiB预算约束；满容量不隐式淘汰。
    repeated InventoryGroundCoinMessage coins = 3; // 最多12个NPC原始金币掉落的活动事实；不授予客户端领取或记账权。
}

// 金币保留原死亡位置与自动Trigger；金额沿用DS原掉落表的一次抽样，不创建第二钱包。
message InventoryGroundCoinMessage
{
    uint64 coin_id = 1; // 原副本NPC稳定ActorId 5..16，同一次死亡只有一个唯一掉落身份。
    int64 amount = 2; // 原抽样的正整数数量，保留long范围；不能补默认值或重抽。
    float position_x = 3; // DS原死亡位置X，必须有限，不改变服务端拾取触发范围。
    float position_y = 4; // DS原死亡位置Y；视觉抬高由原Prefab负责。
    float position_z = 5; // DS原死亡位置Z，不从客户端视野或参考Actor选择推导。
}

message InventoryGroundItemMessage
{
    string instance_id = 1; // 原容器实例32位小写hex，丢地/转交保留身份，不为每Client复制新物品。
    string content_id = 2; // 最多128个ASCII目录键，容器Kind/容量/mask仍由Run按共同目录核验。
    string world_owner_id = 3; // 真实地面归属32位小写hex，Pickup必须匹配，不能仅凭ContentId拾取。
    uint32 revision = 4; // 非零实例修订号，迟到状态不覆盖已安装的更新。
    float position_x = 5; // DS裁定的有限世界位置X，不是Client提交的掉落坐标。
    float position_y = 6; // DS裁定的有限世界位置Y，支撑规则由既有Gameplay负责。
    float position_z = 7; // DS裁定的有限世界位置Z，不在Codec增加距离或落点政策。
    float rotation_x = 8; // 世界Quaternion X，四分量有限且平方长度0.99..1.01，不自动归一化伪造原状态。
    float rotation_y = 9; // 世界Quaternion Y，与XYZW共同校验，零Quaternion拒绝。
    float rotation_z = 10; // 世界Quaternion Z，与XYZW共同校验，不是Euler角。
    float rotation_w = 11; // 世界Quaternion W，与XYZW共同校验，默认全0不构成合法姿态。
    InventoryOwnedContainerStateMessage container_state = 12; // 必须显式Schema1组分，保留真实ulong GMU；空瓶与缺状态不同。
    InventoryOwnedMaterialStateMessage material_state = 13; // 原材料别名，必须与完整Item同值；一般卡/杖/物品可都无材料状态。
    InventoryOwnedItemMessage item = 14; // 新协议必填完整根，位置WorldItem=5/Slot=-1/空父；旧根/材料字段须与之同值。
    repeated InventoryOwnedItemMessage children = 15; // 仅此根法杖的安装卡，保留原ID/父/次数/附件；与所有地面根合计最多16384实例。
}

////////////////////////////////////////////////////////////////
// 资产身份与位置：装备法杖、安装卡及随身法术专区，不伪造真实背包
////////////////////////////////////////////////////////////////

// 与Core值合同对应；Hash只作兼容性标识，不赋予客户端资产写权限。
message InventoryOwnedAssetMessage
{
    uint32 schema_version = 1; // Owned资产合同当前3；旧版缺真实金币/修订，不能补0冒充统一余额。
    string run_id = 2;                        // 业务Run ID，32位小写hex，不是本地存档ID。
    string player_id = 3;                     // 业务Player ID，32位小写hex。
    string inventory_id = 4;                  // Run/Player组合的库存身份，最多96个ASCII字节，不能按物品ID截成32位。
    string gameplay_config_hash = 5;          // 64位小写SHA256，须与认证后当前配置完全一致。
    string selected_wand_instance_id = 6;     // 当前已装备法杖实例，32位小写hex，不是模板ContentId。
    uint64 actor_id = 7;                      // 本Run稳定Actor身份，当前玩家范围1..4，非Unity InstanceID。
    uint32 inventory_version = 8;             // 当前真实资产版本，默认0拒绝。
    repeated InventoryOwnedItemMessage items = 9; // 最多4096项的有界完整携带闭包；不承诺无限背包。
    int64 gold = 10; // 同一玩家当前总余额，必须非负且保留long全范围；不是第二种局内币或永久Wallet提交。
    uint32 currency_version = 11; // 非零DS钱包事实修订，独立于物品/Mana版本；同版本不得改变Gold，重连不重置。
}

// 不传Sprite、Prefab路径或可执行代码；外观和规则从受控ContentId/Hash解析。
message InventoryOwnedItemMessage
{
    string instance_id = 1;                   // 资产实例ID，32位小写hex，移动/重连不重建。
    string content_id = 2;                    // 受控目录键，最多128个ASCII字节；网络值不能自由加载资源。
    string parent_instance_id = 3; // 包内指真实装备包，安装卡指装备/备用杖；玩家装备根与专区为空。
    uint32 revision = 4;                      // 非零实例修订号，读取快照不是修改操作。
    int32 location_kind = 5; // 原稳定编号：Bag内1/安装2/装备杖3/装备包4/专区7/工具8；其余拒绝。
    int32 slot = 6; // Bag内固定-1，装备杖0..2/工具0..6/程序0..31/专区0..255，Run再验目录。
    int32 x = 7;                              // 保留值位置合同的X字段，当前非Grid闭包不由Client推导坐标。
    int32 y = 8;                              // 保留值位置合同的Y字段。
    int32 quarter_turns = 9;                  // 旋转四分之一圈次数0..3，不能借旋转改变归属。
    int32 remaining_charges = 10;             // 当前真实有限次数，非负；不能从模板默认值补满。
    bool has_unlimited_charges = 11;           // 无限次数必须由服务器显式给出，false默认仍是有限。
    bool use_template_wand_stats = 12;         // true使用共同Hash保护的模板，且wand_stats必须为空。
    InventoryOwnedWandStatsMessage wand_stats = 13; // false的装备法杖必须完整提供实例固定属性；卡片不得夹带。
    InventoryOwnedContainerStateMessage container_state = 14; // 仅容器有显式状态，空瓶与缺状态不同；与Wand属性互斥。
    InventoryOwnedMaterialStateMessage material_state = 15; // 仅Material实物，显式Schema1/Key/真实GMU；与容器和法杖状态互斥。
    InventorySpellAttachmentStateMessage attachment_state = 16; // 仅具体产出卡；可缺省为关闭，来源失效仍保存设置，不搬运材料。
    bool entry_bound_backpack = 17; // 业务可信入场来源标记；仅真实装备包可为true，地面和子卡拒绝，命令无设置口。
}

// 固体物品是原实例持有的真实数量，不是一个默认满量模板或容器组分。
// 卡片设置不是容器数量；清除由可选状态缺省表达，既有显式Enabled值仍保真。
message InventorySpellAttachmentStateMessage
{
    uint32 schema_version = 1; // 显式1，缺省0或未知版本拒绝。
    string container_id = 2; // 32位小写hex来源实例；来源已离包或消失仍保留设置，执行时再次裁决。
    uint64 dose = 3; // 原正整数GMU剂量，不按100或瓶内余量截断配置。
    bool enabled = 4; // 只控制此卡执行时是否请求供料；不授予客户端扣量权限。
}

message InventoryOwnedMaterialStateMessage
{
    uint32 schema_version = 1; // 必须显式1，缺状态/0不取得材料写资格。
    uint32 material_key = 2; // 稳定材料身份1..8，校验后才可窄化byte，目录Key由领域层再次核对。
    uint64 quantity = 3; // GMU精确正整数，不得float/uint32/有符号BIGINT截断，容量由可信目录再验。
}

// 容器已知状态的值副本；组分单位为GMU，目录容量与材料掩码仍由Run核验。
message InventoryOwnedContainerStateMessage
{
    uint32 schema_version = 1; // 显式1表示已知容器状态；缺省0拒绝，零组分是空瓶。
    repeated InventoryOwnedMaterialAmountMessage components = 2; // 最多8种唯一已知材料，零项为已知空瓶；数量必须正且总量不溢出。
}

message InventoryOwnedMaterialAmountMessage
{
    uint32 material_key = 1; // 稳定材料身份1..8；先校验再转byte，不允许截断回合法键。
    uint64 quantity = 2; // GMU精确无符号数量，禁止float/double或uint32截断；容量/mask由真实目录再验。
}

// 法杖实例的固定属性；高频Mana/CD不放进模板，更不能在Client修改模板SO。
message InventoryOwnedWandStatsMessage
{
    float max_mana = 1;                       // 法力上限，大于0且有限。
    float mana_regen_per_second = 2;          // 每秒恢复量，非负；只读展示不执行恢复。
    float base_cast_delay = 3;                // 基础射速间隔，单位second，非负。
    float base_reload_time = 4;               // 基础Reload间隔，单位second，非负。
    float base_spread_degrees = 5;            // 基础散射角，单位degree，有限值。
    int32 program_capacity = 6;               // 程序槽容量，当前1..32。
    int32 base_draws = 7;                     // 基础抽取数，由领域层再核对玩法范围。
    bool shuffle = 8;                         // 是否洗牌，只安装服务器事实。
    repeated string always_cast_content_ids = 9; // 固有法术目录键，最多32项，每项最多128个ASCII字节。
}

////////////////////////////////////////////////////////////////
// 当前资源和资格：只读结果，不创建Client Authority Workspace
////////////////////////////////////////////////////////////////

// 每根装备法杖完整提供，不能只发送选中法杖而令其他槽位凭空回满。
message InventoryWandPresentationMessage
{
    string instance_id = 1;                   // 对应装备法杖实例ID，32位小写hex。
    uint32 program_revision = 2;              // 服务器真实程序版本，非零，不由导入次数重新编号。
    float current_mana = 3;                   // 当前Mana，非负有限，目录上限由读模型再次核对。
    float cooldown_remaining = 4;            // 当前剩余Cooldown/Reload，单位second，非负有限。
}

// RemainingCharges来自同批items，避免同一快照出现两个相互矛盾的次数来源。
message InventorySpellUsePresentationMessage
{
    string instance_id = 1;                   // 同批安装卡/专区卡实例ID，32位小写hex。
    bool eligible = 2;                        // 服务器已确定的本局资格，未来次数为0不等于本局资格消失。
}

////////////////////////////////////////////////////////////////
// 授权库存命令与收据：512B独立预算，不把完整快照当成写请求
////////////////////////////////////////////////////////////////

// 只表达操作意图。CallerId只在本机关联UI；Actor/Player由认证连接提供，不能让Client自报。
// Expected版本用于拒绝过期拖拽，不是Client修改服务器版本的指令；实际资产只由Run改动。
message InventoryCommandMessage
{
    uint32 protocol_version = 1;              // 应用协议版本，必须等于ProtocolCompatibility.CurrentVersion。
    fixed64 gameplay_hash = 2;                // 当前共同玩法配置指纹，非零且必须与认证Run匹配。
    fixed64 command_id = 3;                   // 当前连接Epoch内单调命令号，非零；重试必须沿用原意图。
    uint32 connection_epoch = 4;              // 认证连接代数，非零；旧连接命令不能作用到重入后的角色。
    uint32 expected_inventory_version = 5;    // Client提交时所读的资产版本，非零；冲突后读取新快照再操作。
    uint32 kind = 6; // SelectWand=1、PlaceCard=2、SelectTool=3、CollectMaterial=4、PourContainer=5、BindTool=6、DropContainer=7、PickupContainer=8、ThrowContainer=9、ReleaseSolid=10、ConfigureSpellAttachment=11、MoveOwned=12、EquipWand=13、DropItem=14、PickupItem=15、BeginWandResearch=16、EndWandResearch=17；先验原uint防byte截断。
    string item_id = 7; // 32位小写hex真实GUID；绑定须为真实携带Container，Run核验归属，不能用ContentId替代。
    string source_wand_id = 8; // 原程序所属法杖ID；从SpellStorage取卡、选择、绑定或F/H时为空。
    uint32 source_program_revision = 9; // 非空SourceWand对应的非零程序版本；Storage来源、选择、绑定或F/H为0。
    string target_wand_id = 10; // 目标法杖ID；移入SpellStorage、选择、绑定或F/H时为空。
    uint32 target_program_revision = 11; // 非空TargetWand对应的非零程序版本；Storage目标、选择、绑定或F/H为0。
    int32 target_slot = 12; // 选杖0..2、选工具/绑定/F/H槽0..6；放卡Wire预算0..255，真实绑定/容量由Run核验。
    bool to_spell_storage = 13; // true仅表示随身法术专区；选择、绑定及F/H必须false，不代表Bag/仓库/地面。
    uint64 transfer_budget = 14; // GMU请求上限：Collect为1..4096、Pour为1..1024；非F/H必须0，实际数量由DS事务裁决。
    float aim_origin_x = 15; // 镜头射线起点X，必须有限；非F/H必须0，DS按真实Actor位置重新核验采样。
    float aim_origin_y = 16; // 镜头射线起点Y，必须有限；非F/H必须0，不是已授权世界落点。
    float aim_origin_z = 17; // 镜头射线起点Z，必须有限；非F/H必须0，不接受客户端直接写世界结果。
    float aim_direction_x = 18; // 射线方向X，三分量有限且平方长度近1；非F/H必须0，不增加游戏角度政策。
    float aim_direction_y = 19; // 射线方向Y，与XYZ共同校验平方长度0.99..1.01；非F/H必须0。
    float aim_direction_z = 20; // 射线方向Z，与XYZ共同校验平方长度0.99..1.01；非F/H必须0，轨迹仍由DS重算。
    string world_owner_id = 21; // 仅Pickup必需的32位小写hex地面归属；Drop与非地面命令必须空。
    string target_backpack_id = 22; // 手动Pickup的32位小写hex真实背包；自动Pickup/Drop/其它命令必须空。
    int32 grid_x = 23; // 手动Pickup目标格X为0..255，实际形状/容量由Run核验；其它情形必须0。
    int32 grid_y = 24; // 手动Pickup目标格Y为0..255，不能先窄化超宽值；其它情形必须0。
    int32 quarter_turns = 25; // 手动Pickup旋转0..3；自动Pickup/Drop/其它命令必须0。
    bool auto_place = 26; // Pickup为true时由DS按既有装包语义寻找位置且不携带目标格；Drop/非地面必须false。
    string attachment_container_id = 27; // 仅ConfigureSpellAttachment=11启用时的来源实例，清除及其它命令必须空。
    uint64 attachment_dose = 28; // 仅Kind11启用时的正GMU剂量，清除和其它命令为0；不是本次已扣数量。
    bool attachment_enabled = 29; // Kind11配置开关；关闭必须空来源/零剂量，客户端不直接改卡片状态。
    int32 target_location_kind = 30; // 新12/13/15指定既有编号：包1/杖槽2/装备杖3/装备包4/专区7/工具8，自动拾取为0；旧命令必须0。
    bool whole_stack = 31; // 仅MoveOwned12/DropItem14可请求原同格整堆语义；不是客户端上传的数量或实例表，其余false。

}

// 只返回本条命令结果，资产变化由随后完整快照提供；不发送独立Success以免与Failure矛盾。
message InventoryCommandReceiptMessage
{
    uint32 protocol_version = 1;              // 应用协议版本，必须与当前Client/DS一致。
    fixed64 gameplay_hash = 2;                // 同一认证Run的配置指纹，收据不能跨配置使用。
    fixed64 command_id = 3;                   // 原命令号；Client只匹配自己的pending，不当成资产授权。
    uint32 connection_epoch = 4;              // 当前认证连接代数；旧Epoch收据不得关闭新连接pending。
    uint32 inventory_version = 5;             // 成功必须非零；尚未就绪等失败允许0，不用虚构资产版本。
    uint32 failure = 6;                       // None=0；1..11按Core失败枚举；Success由None推导，未知值拒绝。
    uint64 transferred = 7; // 已提交GMU精确数量；失败必须0，成功0兼容旧选择/移卡，实际F/H数量由事务给出。
    uint32 transfer_failure = 8; // 原材料事务失败0..12（IncompatibleMaterial）；非None要求failure非None，先验原uint防byte截断。
}
