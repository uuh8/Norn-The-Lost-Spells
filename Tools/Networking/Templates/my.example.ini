# 复制到 RPG/.tools/local-mysql/my.ini 后修改路径；这里的 RPG 是 Unity 工程目录。
# basedir 必须包含 bin/mysqld.exe；datadir 必须是已独立初始化的 Norn 数据目录。
# 不把已有个人/系统数据库的数据目录填入此模板，也不覆盖已有实例的配置。
[mysqld]
basedir="C:/REPLACE_WITH_MONOREPO_ROOT/RPG/.tools/mysql/mysql-8.4.13-winx64"
datadir="C:/REPLACE_WITH_MONOREPO_ROOT/RPG/.tools/local-mysql/data"
port=13384
bind-address=127.0.0.1
mysqlx=0
character-set-server=utf8mb4
collation-server=utf8mb4_0900_ai_ci
log-error="C:/REPLACE_WITH_MONOREPO_ROOT/RPG/.tools/local-mysql/mysql.log"
pid-file="C:/REPLACE_WITH_MONOREPO_ROOT/RPG/.tools/local-mysql/mysql.pid"
innodb-buffer-pool-size=64M
